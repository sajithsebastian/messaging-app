name: Build Installers

on:
  push:
    branches: [ master, main, installers ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --windowed --name WhatsAppDispatcher --add-data ".env.example;." main.py
        
    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --onefile --windowed --name WhatsAppDispatcher --add-data ".env.example:." main.py
        # Create DMG (simplified version for CI)
        mkdir dist/dmg
        cp -r dist/WhatsAppDispatcher.app dist/dmg/
        hdiutil create -volname "WhatsApp Dispatcher" -srcfolder dist/dmg -ov -format UDZO dist/WhatsAppDispatcher.dmg

    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --onefile --name WhatsAppDispatcher --add-data ".env.example:." main.py
        tar -czvf dist/whatsapp-dispatcher-linux.tar.gz -C dist WhatsAppDispatcher
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WhatsAppDispatcher-${{ matrix.os }}
        path: |
          dist/*.exe
          dist/*.dmg
          dist/*.tar.gz
