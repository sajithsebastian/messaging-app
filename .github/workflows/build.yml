name: Build and Release

on:
  push:
    branches: [ master, main, installers ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: WhatsAppDispatcher.exe
          - os: macos-latest
            artifact_name: WhatsAppDispatcher.dmg
          - os: ubuntu-latest
            artifact_name: whatsapp-dispatcher-linux.tar.gz

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        
    - name: Build Windows Executable
      if: matrix.os == 'windows-latest'
      run: |
        python -m PyInstaller --onefile --windowed --name WhatsAppDispatcher --add-data ".env.example;." main.py
        
    - name: Build macOS DMG
      if: matrix.os == 'macos-latest'
      run: |
        python -m PyInstaller --onefile --windowed --name WhatsAppDispatcher --add-data ".env.example:." main.py
        mkdir dist/dmg
        cp -r dist/WhatsAppDispatcher.app dist/dmg/
        hdiutil create -volname "WhatsApp Dispatcher" -srcfolder dist/dmg -ov -format UDZO dist/WhatsAppDispatcher.dmg

    - name: Build Linux Tarball
      if: matrix.os == 'ubuntu-latest'
      run: |
        chmod +x build_linux.sh
        ./build_linux.sh
        mv whatsapp-dispatcher-linux.tar.gz dist/
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          dist/*.exe
          dist/*.dmg
          dist/*.tar.gz
